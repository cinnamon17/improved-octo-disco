faq:
  title: "Frequently Asked Questions (FAQ)"
  q1: "What is an iCal / ICS file?"
  a1: "An iCal file or link (.ics extension) is an international standard used by most vacation rental platforms to share real-time calendar availability."
  q2: "Why do I need to merge my iCal links?"
  a2: "If you manage your property on Booking and Airbnb simultaneously, linking them directly to each other can cause circular lockups or update delays. A unified link acts as a central hub, consolidating all booked dates in one place."
  q3: "How often is availability updated?"
  a3: "Our tool periodically processes and updates calendars. When a platform requests your unique URL, it receives the latest version stored on the server."

