faq:
  title: "Preguntas Frecuentes (FAQ)"
  q1: "¿Qué es un archivo iCal / ICS?"
  a1: "Un archivo o enlace iCal (extensión .ics) es un estándar internacional utilizado por la mayoría de las plataformas de alquiler vacacional para compartir calendarios de ocupación en tiempo real."
  q2: "¿Por qué necesito fusionar mis enlaces iCal?"
  a2: "Si gestionas tu propiedad en Booking y Airbnb simultáneamente, conectar sus enlaces directamente entre sí puede provocar bloqueos circulares o retrasos en la actualización. Un enlace unificado actúa como hub centralizador, consolidando todas las fechas reservadas en un solo punto."
  q3: "¿Cada cuánto tiempo se actualiza la disponibilidad?"
  a3: "Nuestra herramienta procesa y actualiza los calendarios periódicamente. Cuando una plataforma realiza una petición a tu URL única, se sirve la versión más actualizada almacenada en el servidor."

