# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  BOT_KEY: '%env(BOT_KEY)%'
  BOT_URL: 'https://api.telegram.org/'
  BOT_API: '%BOT_URL%%BOT_KEY%/'
  OPENAI_KEY: 'Bearer %env(OPENAI_KEY)%'
  OPENAI_URL: 'https://api.deepseek.com/chat/completions'
  ADMIN_CHAT_ID: 1136298813

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Command\SyncIcalCalendarsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # services_test.yaml REEMPLAZA a services.yaml, no lo importa: cualquier
    # binding explicito de config/services.yaml hay que duplicarlo aqui o el
    # autowiring de test rompe con "Cannot autowire service".
    App\Service\TelegramSecretTokenValidator:
        arguments:
            $secretToken: '%telegram.payments.secret_token%'

    App\Service\BotUpdateTranslator:
        arguments:
            $topUpPacks: '%telegram.payments.top_up_packs%'
            $starsToCredits: '%telegram.payments.stars_to_credits%'

    App\Service\CreditPriceCalculator:
        arguments:
            $starsToCredits: '%telegram.payments.stars_to_credits%'
            $requestPrice: '%telegram.payments.ai_request_price%'
            $fullChargeTokens: '%telegram.payments.ai_full_charge_tokens%'
            $minChargeableTokens: '%telegram.payments.ai_min_chargeable_tokens%'
